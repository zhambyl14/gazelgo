<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tasu — жүк тасымалы және спецтехника платформасы.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tasu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tasu</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Flutter жүктелгенше көрінетін ақ экран: Tasu логотип-пині секіріп,
       астынан сары толқын таралады (қосымшаның ішкі splash-ымен бірдей). */
    html, body { margin: 0; height: 100%; background: #fff; }
    #tasu-loader {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background: #fff; z-index: 9999;
      transition: opacity .25s ease;
    }
    #tasu-loader .pin { position: relative; width: 82px; height: 100px; }
    #tasu-loader img {
      width: 82px; height: 100px; display: block;
      animation: tasu-hop 1.6s ease-in-out infinite;
      transform-origin: 50% 100%;
    }
    #tasu-loader .ring {
      position: absolute; left: 50%; bottom: -6px; width: 18px; height: 6px;
      margin-left: -9px; border: 2px solid rgba(232,168,0,.55);
      border-radius: 50%; animation: tasu-ring 1.6s ease-out infinite;
    }
    @keyframes tasu-hop {
      0%, 30%, 100% { transform: translateY(0) scale(1, 1); }
      55% { transform: translateY(-22px) scale(1, 1); }
      78% { transform: translateY(0) scale(1.05, .93); }
      88% { transform: translateY(0) scale(1, 1); }
    }
    @keyframes tasu-ring {
      0%, 75% { transform: scale(.4); opacity: 0; }
      78% { transform: scale(1); opacity: 1; }
      100% { transform: scale(8); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="tasu-loader">
    <div class="pin">
      <img src="icons/tasu_logo.png" alt="Tasu">
      <div class="ring"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('tasu-loader');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Web push көмекшілері (lib/core/web_notify_web.dart шақырады).
    // Қосымша АШЫҚ тұрғанда келген push-ты жүйелік хабарландыру ретінде
    // көрсету — iOS PWA-да `new Notification()` жұмыс істемейді, тек
    // service worker тіркеуі арқылы көрсетуге болады.
    window.tasuShowNotification = function (title, body) {
      try {
        if (!('serviceWorker' in navigator) || !('Notification' in window) ||
            Notification.permission !== 'granted') return;
        navigator.serviceWorker
          .getRegistration('/firebase-cloud-messaging-push-scope')
          .then(function (reg) {
            if (!reg) return;
            return reg.showNotification(title, {
              body: body,
              icon: '/icons/Icon-192.png',
              badge: '/icons/Icon-192.png',
            });
          })
          .catch(function () {});
      } catch (e) {}
    };
    // Қосымша «Басты экранға қосылған» (PWA) күйде ашылды ма? iPhone-да
    // web push тек осы күйде жұмыс істейді.
    window.tasuIsStandalone = function () {
      try {
        return window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
      } catch (e) {
        return false;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
