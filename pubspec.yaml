name: tasu
description: "Tasu — жүк тасымалы және спецтехника платформасы (клиент, орындаушы, модератор)."
publish_to: 'none'
version: 1.0.4+16
environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.0
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  http: ^1.5.0
  flutter_local_notifications: ^19.0.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  shared_preferences: ^2.3.2
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFC400"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

# Splash БАПТАУЫ — пакеттің өзі ӘДЕЙІ dev_dependencies-те ЖОҚ.
#
# СЕБЕБІ: `flutter_native_splash` — тек бір реттік ГЕНЕРАТОР. Ол Android
# drawable-дарын (`launch_background`, `android12splash`), `styles.xml`-ді
# және iOS LaunchImage-ін жасайды; олардың бәрі репозиторийде сақтаулы,
# ал қосымша кодында пакет мүлдем импортталмайды.
#
# Ал dev_dependency болып тұрғанда Flutter оны RELEASE build-та Gradle
# classpath-ынан алып тастайды, бірақ `GeneratedPluginRegistrant.java`
# ішінде тіркеуін қалдырады да, appbundle жиналмай қалады:
#   error: package net.jonhanson.flutter_native_splash does not exist
#
# SPLASH-ты ӨЗГЕРТУ КЕРЕК БОЛСА:
#   1) dart pub add -d flutter_native_splash
#   2) dart run flutter_native_splash:create   (төмендегі баптау қолданылады)
#   3) dart pub remove flutter_native_splash   ← міндетті, әйтпесе release
#      build жоғарыдағы қатемен құлайды
flutter_native_splash:
  # Ақ фон — қосымша ашылғанда Flutter-дегі _Splash экранымен (Gz.surface = ақ)
  # дәл сәйкес келеді, сондықтан native splash → логотип+слоган үзіліссіз ауысады.
  color: "#FFFFFF"
  # icon.png-тың орнына шеті бос (padding-і бар) арнайы splash суреті —
  # логотип өз өлшемінде тұрады, «жақындап/үлкейіп» кетпейді.
  image: "assets/icon/splash.png"
  android_12:
    color: "#FFFFFF"
    # Android 12+ дөңгелек масканың ішіне сыятын, айналасы бос нұсқа.
    image: "assets/icon/splash_android12.png"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/vehicles/
    - assets/icon/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Rubik-Black.ttf
          weight: 900
